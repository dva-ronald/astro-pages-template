media:
  input: public/media
  output: /media

components:
  link:
    type: object
    label: Link
    fields:
      - name: label
        label: Label
        type: string
        required: true
        description: Button or link text shown to visitors.
        placeholder: See the work
      - name: href
        label: URL
        type: string
        required: true
        description: >-
          Internal page path with a trailing slash, or a full external URL.
          Examples: /about/ · /work/ · /blog/ · /blog/my-post/ · https://example.com
        placeholder: /about/

  button:
    type: object
    label: Button
    fields:
      - name: label
        label: Label
        type: string
        required: true
        description: Text on the button.
        placeholder: See the work
      - name: style
        label: Style
        type: select
        options:
          values:
            - name: primary
              label: Primary (filled)
            - name: secondary
              label: Secondary (outline)
        description: Visual style of the button.
      - name: page
        label: Page
        type: reference
        description: Pick an internal page from this site (preferred for internal links).
        options:
          collection: pages
          search: "title,fields.slug,fields.description"
          value: "{fields.slug}"
          label: "{fields.title}"
      - name: href
        label: Custom URL
        type: string
        description: >-
          Optional. External URL or manual path. If set, this overrides the Page picker.
          Examples: https://example.com · /blog/my-post/
        placeholder: https://example.com

  theme:
    type: select
    label: Theme
    options:
      values:
        - light
        - dark
        - brand

content:
  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: title
        label: Site title
        type: string
        required: true
      - name: tagline
        label: Tagline
        type: string
      - name: description
        label: Default description
        type: text
        required: true
      - name: url
        label: Site URL
        type: string

  - name: navigation
    label: Navigation
    type: file
    path: src/data/navigation.json
    format: json
    fields:
      - name: items
        label: Items
        type: object
        list: true
        description: Header/footer links. Prefer Page picker; use Custom URL for /blog/ or external links.
        fields:
          - name: label
            label: Label
            type: string
            required: true
            description: Nav label in the header/footer.
            placeholder: Work
          - name: page
            label: Page
            type: reference
            description: Choose an internal page.
            options:
              collection: pages
              search: "title,fields.slug"
              value: "{fields.slug}"
              label: "{fields.title}"
          - name: href
            label: Custom URL
            type: string
            description: >-
              Optional override (e.g. /blog/ or https://…). If set, this wins over Page.
            placeholder: /blog/

  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: slug
        label: Slug
        type: string
        description: Use "home" for the homepage. Otherwise used as the URL path.
      - name: draft
        label: Draft
        type: boolean
      - name: sections
        label: Sections
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "{type}"
        blockKey: type
        blocks:
          - name: hero
            label: Hero
            fields:
              - name: theme
                component: theme
              - name: variant
                label: Variant
                type: select
                options:
                  values: [default, split, centered]
              - name: brand
                label: Brand
                type: string
              - name: headline
                label: Headline
                type: string
                required: true
              - name: text
                label: Supporting text
                type: text
              - name: buttons
                label: Buttons
                component: button
                list:
                  max: 3
                description: Add up to 3 buttons. Pick a Page and/or set a Custom URL; choose Primary or Secondary style.
              - name: image
                label: Image
                type: image
              - name: imageAlt
                label: Image alt
                type: string

          - name: richText
            label: Rich text
            fields:
              - name: theme
                component: theme
              - name: variant
                label: Variant
                type: select
                options:
                  values: [default, narrow, band]
              - name: heading
                label: Heading
                type: string
              - name: body
                label: Body
                type: rich-text
                required: true

          - name: features
            label: Features
            fields:
              - name: theme
                component: theme
              - name: variant
                label: Variant
                type: select
                options:
                  values: [default, split, compact]
              - name: heading
                label: Heading
                type: string
              - name: text
                label: Supporting text
                type: text
              - name: items
                label: Items
                type: object
                list: true
                fields:
                  - name: title
                    label: Title
                    type: string
                    required: true
                  - name: text
                    label: Text
                    type: text
                    required: true

          - name: cta
            label: Call to action
            fields:
              - name: theme
                component: theme
              - name: variant
                label: Variant
                type: select
                options:
                  values: [default, band, centered]
              - name: heading
                label: Heading
                type: string
                required: true
              - name: text
                label: Supporting text
                type: text
              - name: buttons
                label: Buttons
                component: button
                list:
                  max: 3
                description: Add up to 3 buttons with style + page picker or custom URL.

          - name: faq
            label: FAQ
            fields:
              - name: theme
                component: theme
              - name: variant
                label: Variant
                type: select
                options:
                  values: [default, compact, split]
              - name: heading
                label: Heading
                type: string
              - name: text
                label: Supporting text
                type: text
              - name: items
                label: Items
                type: object
                list: true
                fields:
                  - name: question
                    label: Question
                    type: string
                    required: true
                  - name: answer
                    label: Answer
                    type: rich-text
                    required: true

          - name: imageText
            label: Image + text
            fields:
              - name: theme
                component: theme
              - name: variant
                label: Variant
                type: select
                options:
                  values: [default, split, reversed]
              - name: heading
                label: Heading
                type: string
                required: true
              - name: text
                label: Text
                type: rich-text
              - name: image
                label: Image
                type: image
                required: true
              - name: imageAlt
                label: Image alt
                type: string
              - name: buttons
                label: Buttons
                component: button
                list:
                  max: 2
                description: Optional buttons (page picker or custom URL).

          - name: logos
            label: Logos
            fields:
              - name: theme
                component: theme
              - name: variant
                label: Variant
                type: select
                options:
                  values: [default, compact, band]
              - name: heading
                label: Heading
                type: string
              - name: items
                label: Items
                type: object
                list: true
                fields:
                  - name: name
                    label: Name
                    type: string
                    required: true
                  - name: image
                    label: Logo image
                    type: image

          - name: blogRoll
            label: Blog roll
            fields:
              - name: theme
                component: theme
              - name: variant
                label: Variant
                type: select
                options:
                  values: [default, compact, split]
              - name: heading
                label: Heading
                type: string
              - name: text
                label: Supporting text
                type: text
              - name: limit
                label: Limit
                type: number

  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      sort: pubDate
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: pubDate
        label: Publish date
        type: date
        required: true
      - name: updatedDate
        label: Updated date
        type: date
      - name: draft
        label: Draft
        type: boolean
      - name: heroImage
        label: Hero image
        type: image
      - name: body
        label: Body
        type: rich-text
